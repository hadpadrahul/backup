# ~/.config/starship.toml

palette = "catppuccin_mocha"

add_newline = false

command_timeout = 1000

format = """[$os$username](#fab09e)$directory$fill$all$character""" #$python$golang$git_branch

[character]
success_symbol = "[➜](bold green)"  #cd5e42


[os]
disabled = false
style = "fg:#fab09e"

[os.symbols]
Windows = " "
Linux   = " "
Macos   = " "

[username]
show_always = true
# style_user = "rosewater"  #fab09e

[directory]
format = "[ $path ]($style)"
fish_style_pwd_dir_length = 2
truncation_length = 1
truncation_symbol = '…/'
style = "#4fb0e1"  #0ca0d8

[golang]
format = "[ ](bold cyan)"

[python]
detect_extensions = [] # Use a conditional format that only renders if $virtualenv is present
detect_files = []
format = "[  $version ]($style)"  #b8ff75
style = "#b8ff75"

[git_branch]
format =  "[ $symbol$branch(:$remote_branch) ]($style)"
style = "#FF7420"  #FF7420

[cmd_duration]
min_time = 0
show_milliseconds = true
style = "#4fdde4"  #00FFFF
format = "[ $duration ]($style)"



[fill]
symbol = ' '

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
