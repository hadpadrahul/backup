##### Keybindings

# Prefix

# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

bind C-b send-prefix

##### Terminal

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g update-environment "SSH_CONNECTION IS_SSH"

##### General

set -g mouse on
set -g history-limit 200000
set -sg escape-time 100
set -g set-clipboard on
set -g detach-on-destroy off
set -g focus-events on
set -g extended-keys on
set -s assume-paste-time 1
set -sg repeat-time 600

# set -g status-position top
set -g status-interval 5
set -g status-justify centre
set -g display-time 2000

##### Windows

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g status-left-length 100
set -g status-right-length 100

##### Vi mode

setw -g mode-keys vi
set -g status-keys vi

##### Reload

bind r source-file ~/.config/tmux/tmux.conf ; refresh-client ; display-message "Reloaded tmux config"

##### Current directory

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

##### Pane navigation

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Pane resizing

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Helper toggles

bind z resize-pane -Z
bind * setw synchronize-panes
bind $ command-prompt "rename-session %%"

##### Copy mode

# v = character selection
bind -T copy-mode-vi v send -X begin-selection
# V = line selection
bind -T copy-mode-vi V send -X select-line
# y = copy
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Space = start block selection
bind -T copy-mode-vi Space send -X begin-selection \; send -X rectangle-toggle
# cancel
bind -T copy-mode-vi Escape send -X cancel

